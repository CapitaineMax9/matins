name: Rappels Instagram

on:
  schedule:
    # Toutes les 5 minutes (minimum autorisé par GitHub). Les horaires réels
    # sont dans config/messages.json ; GitHub peut avoir quelques minutes de retard.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = envoie les rappels à l'heure, test = message de test sur Discord"
        required: false
        default: normal
        type: choice
        options: [normal, test]

permissions:
  contents: write # pour enregistrer state/sent.json

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer les rappels arrivés à l'heure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: python3 scripts/send_reminders.py

      - name: Enregistrer les rappels envoyés
        if: always()
        run: |
          if git diff --quiet -- state/; then
            echo "Rien à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          git commit -q -m "Rappels envoyés ($(TZ=Europe/Paris date '+%d/%m %H:%M'))"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
